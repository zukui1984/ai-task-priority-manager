openapi: 3.1.0
info:
  title: Task Manager API
  version: 1.0.0
paths:
  /tasks:
    get:
      responses: { '200': { content: { 'application/json': { schema: { type: array, items: { $ref: '#/components/schemas/Task' } } } } }
    post:
      requestBody: { content: { 'application/json': { schema: { $ref: '#/components/schemas/TaskCreate' } } } }
      responses: { '201': { content: { 'application/json': { schema: { $ref: '#/components/schemas/Task' } } } } }
  /tasks/{id}:
    put: { parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], requestBody: { content: { 'application/json': { schema: { $ref: '#/components/schemas/TaskUpdate' } } } }, responses: { '200': { content: { 'application/json': { schema: { $ref: '#/components/schemas/Task' } } } } } }
    delete: { parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { '204': {} } }
components:
  schemas:
    Task:
      type: object
      properties: { id: { type: integer }, title: { type: string }, description: { type: string }, priority: { type: string, enum: [low, medium, high] }, completed: { type: boolean } }
    TaskCreate: { type: object, required: [title], properties: { title: { type: string }, description: { type: string }, priority: { type: string, enum: [low, medium, high], default: medium }, completed: { type: boolean, default: false } } }
    TaskUpdate: { type: object, properties: { title: { type: string }, description: { type: string }, priority: { type: string, enum: [low, medium, high] }, completed: { type: boolean } } }
